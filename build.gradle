plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel", "**/.cache/**")
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.blamejared.com/"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Gameplay tests load only in their dedicated run, never in the distributed mod.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gameTest)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Launch a real world for the isolated progression test mod, then exit with its result.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gameTest
            gameDirectory = file('build/gameTestRun')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        tempered_gametests {
            sourceSet(sourceSets.gameTest)
        }
    }

    unitTest {
        enable()
        testedMod = mods.tempered
    }
    runs.configureEach {
        loadedMods = [mods.tempered]
    }
    runs.gameTestServer.loadedMods = [mods.tempered, mods.tempered_gametests]
}

// Optional development tools are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    testImplementation "org.appliedenergistics:guideme:${guideme_version}:api"
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "net.neoforged:testframework:${neo_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // JEI is available in development runs; Tempered does not use its Java API.
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// Expand version and mod properties in the shipped metadata.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            guideme_version        : guideme_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// The example is generated from the same spec as the live config. Tests reject stale documentation.
tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'tempered.projectDir', project.projectDir.absolutePath
    inputs.file('config.toml.example')
}

// Keep gameplay regressions part of the normal build instead of an optional check.
tasks.named('check').configure {
    dependsOn tasks.named('runGameTestServer')
}

tasks.register('updateConfigExample', JavaExec) {
    group = 'documentation'
    description = 'Regenerate config.toml.example from the registered defaults and explanations.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.auco.tempered.config.ConfigExample'
    systemProperty 'tempered.projectDir', project.projectDir.absolutePath
    workingDir = layout.buildDirectory.get().asFile
}
